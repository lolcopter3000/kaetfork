# Sveltia Config
backend:
  name: github
  repo: "lolcopter3000/thkerr" # Change this!
  branch: main # Change to "master" if your default branch is master

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "gigs"
    label: "Performances"
    folder: "content/gigs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Performance / Event Name", name: "title", widget: "string" }
      - { label: "Date & Time", name: "date", widget: "datetime" }
      - { label: "Venue & Location", name: "location", widget: "string" }
      - { label: "Ticket Link", name: "ticket_link", widget: "string", required: false }
      - { label: "Poster Image", name: "image", widget: "image", required: false }
      - { label: "Notes / Description", name: "notes", widget: "text", required: false }