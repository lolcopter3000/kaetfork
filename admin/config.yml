backend:
  name: github
  repo: "lolcopter3000/thkerr"
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "gigs"
    label: "Archive & Performances"
    folder: "content/gigs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: "json"
    fields:
      - { label: "Title / Work Name", name: "title", widget: "string" }
      
      # DATE & OPTIONAL DATE RANGE
      - { label: "Start Date / Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "End Date (Optional for date ranges)", name: "end_date", widget: "datetime", format: "YYYY-MM-DD", required: false }
      
      # Short 1-2 line summary (appears under title in 12px italics)
      - { label: "10w summary", name: "summary", widget: "string", required: false }

      # MULTIPLE TAGS SELECTOR (Includes Composition)
      - label: "Categories / Tags"
        name: "categories"
        widget: "select"
        multiple: true
        options:
          - { label: "Composition", value: "Composition" }
          - { label: "Performance", value: "Performance" }
          - { label: "Music Release", value: "Music Release" }
          - { label: "Theatre", value: "Theatre" }

      # Image & Expandable Details
      - { label: "Image / Poster", name: "image", widget: "image", required: false }
      - { label: "Venue / Location", name: "location", widget: "string", required: false }
      - { label: "Detailed Notes / Archive Info", name: "notes", widget: "text", required: false }
      - { label: "External Link / Audio / Documentation", name: "ticket_link", widget: "string", required: false }