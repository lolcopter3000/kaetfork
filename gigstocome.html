<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thomas Kerr - Works & Performances</title>
        
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                background-color: #ffffff;
                color: #111111;
                font-family: Georgia, Cambria, "Times New Roman", Times, serif;
                font-size: 16px;
                line-height: 1.6;
                margin: 0;
                padding: 0;
            }
            main {
                width: 100%;
                max-width: 650px;
                margin: 0 auto;
                padding: 3em 1.25em;
            }
            header {
                margin-bottom: 2em;
            }
            a {
                color: #000000;
                text-decoration: underline;
            }
            a:hover {
                color: #555555;
            }

            /* Filter Controls - Clean, Unadorned Text Row */
            .controls {
                margin-bottom: 2.5em;
                font-size: 14px;
                border-bottom: 1px solid #111111;
                padding-bottom: 1.25em;
            }
            .filter-row {
                margin-bottom: 0.75em;
                display: flex;
                align-items: center;
                gap: 8px;
                flex-wrap: wrap;
            }
            input[type="text"] {
                font-family: Georgia, serif;
                font-size: 14px;
                padding: 4px 6px;
                border: 1px solid #777777;
                background: #ffffff;
                outline: none;
                flex-grow: 1;
            }
            input[type="text"]:focus {
                border-color: #000000;
            }
            .btn-filter {
                background: none;
                border: none;
                padding: 0;
                font-family: Georgia, serif;
                font-size: 14px;
                color: #000000;
                text-decoration: underline;
                cursor: pointer;
            }
            .btn-filter.active {
                font-weight: bold;
                text-decoration: none;
            }

            /* Archive Item List */
            .work-list {
                list-style-type: square;
                padding-left: 1.2em;
                margin: 0;
            }
            .work-item {
                margin-bottom: 1.5em;
            }
            .work-title {
                font-size: 16px;
                font-weight: normal;
            }
            .work-meta {
                font-size: 14px;
                color: #555555;
            }
            .work-notes {
                font-size: 14px;
                margin-top: 0.25em;
                color: #222222;
            }
            .work-img {
                display: block;
                max-width: 100%;
                max-height: 240px;
                margin: 0.5em 0;
            }

            /* Responsive Adjustments */
            @media (max-width: 600px) {
                body {
                    font-size: 15px;
                }
                main {
                    padding: 1.5em 1em;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <p><a href="index.html">← return home</a></p>
            </header>

            <!-- Minimalist Control Bar -->
            <div class="controls">
                <div class="filter-row">
                    <span>search:</span>
                    <input type="text" id="search-input" placeholder="filter works...">
                </div>
                <div class="filter-row" id="category-buttons">
                    <span>browse:</span>
                    <button class="btn-filter active" onclick="filterCategory('ALL')">all</button> /
                    <button class="btn-filter" onclick="filterCategory('Performance')">performances</button> /
                    <button class="btn-filter" onclick="filterCategory('Music Release')">releases</button> /
                    <button class="btn-filter" onclick="filterCategory('Theatre')">theatre</button>
                </div>
            </div>

            <!-- Content Container -->
            <ul class="work-list" id="gigs-container">
                <li>Loading archive...</li>
            </ul>
        </main>

        <script>
            let allGigs = [];
            let activeCategory = 'ALL';

            async function loadGigs() {
                const container = document.getElementById('gigs-container');
                const repoUrl = "https://api.github.com/repos/lolcopter3000/thkerr/contents/content/gigs";

                try {
                    const response = await fetch(repoUrl);
                    if (!response.ok) throw new Error("No works found");
                    
                    const files = await response.json();
                    const gigPromises = files.map(file => fetch(file.download_url).then(res => res.json()));
                    allGigs = await Promise.all(gigPromises);

                    // Sort newest first
                    allGigs.sort((a, b) => new Date(b.date) - new Date(a.date));

                    renderGigs(allGigs);
                } catch (err) {
                    container.innerHTML = "<li>No archive items found.</li>";
                }
            }

            function renderGigs(items) {
                const container = document.getElementById('gigs-container');
                if (items.length === 0) {
                    container.innerHTML = "<li><em>No matching entries found.</em></li>";
                    return;
                }

                container.innerHTML = items.map(gig => `
                    <li class="work-item">
                        <span class="work-title">
                            <i>${gig.title}</i>${gig.location ? `, ${gig.location}` : ''}
                        </span> 
                        <span class="work-meta">
                            (${new Date(gig.date).getFullYear()})
                        </span>
                        ${gig.image ? `<img src="${gig.image}" alt="${gig.title}" class="work-img">` : ''}
                        ${gig.notes ? `<div class="work-notes">${gig.notes}</div>` : ''}
                        ${gig.ticket_link ? `<div><a href="${gig.ticket_link}" target="_blank" style="font-size:13px;">[link]</a></div>` : ''}
                    </li>
                `).join('');
            }

            function filterCategory(cat) {
                activeCategory = cat;
                
                document.querySelectorAll('#category-buttons button').forEach(btn => {
                    btn.classList.toggle('active', btn.innerText.toLowerCase() === cat.toLowerCase());
                });

                applyFilters();
            }

            function applyFilters() {
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                
                const filtered = allGigs.filter(gig => {
                    const matchesCategory = (activeCategory === 'ALL' || gig.category === activeCategory);
                    const matchesSearch = (gig.title?.toLowerCase().includes(searchTerm) || 
                                           gig.location?.toLowerCase().includes(searchTerm) ||
                                           gig.notes?.toLowerCase().includes(searchTerm));
                    return matchesCategory && matchesSearch;
                });

                renderGigs(filtered);
            }

            document.getElementById('search-input').addEventListener('input', applyFilters);

            loadGigs();
        </script>
    </body>
</html>
