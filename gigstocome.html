<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thomas kerr</title>
    
    <!-- Load Cormorant Garamond from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
        }
        body {
            color: #000000;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            font-size: 17px;
            line-height: 1.6;
        }

        /* Container width */
        main {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 2.5em 1.25em;
        }

        header {
            text-align: center;
            margin-bottom: 2em;
            font-size: 16px;
        }

        a {
            color: #000000;
            text-decoration: underline;
        }
        a:visited { color: #0A0436; }
        a:hover { color: #555555; }

        /* Filter & Control Bar */
        .controls {
            background: #f9f9f9;
            padding: 12px 14px;
            border: 1px solid #ddd;
            margin-bottom: 2em;
            font-size: 16px;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }
        .filter-group:last-child {
            margin-bottom: 0;
        }
        input[type="text"] {
            padding: 6px 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            flex-grow: 1;
            width: 100%;
            font-family: inherit;
        }
        
        /* Tag Buttons */
        .tag-btn {
            background: #ffffff;
            border: 1px solid #ccc;
            border-radius: 3px;
            color: #555555;
            cursor: pointer;
            padding: 2px 8px;
            font-size: 15px;
            text-decoration: none;
            font-family: inherit;
            display: inline-block;
        }
        .tag-btn:hover {
            background: #f0f0f0;
            color: #000000;
            border-color: #999999;
        }
        .tag-btn.active {
            font-weight: 700;
            color: #000000;
            border-color: #000000;
            background: #e8e8e8;
        }

        /* Work Entry Item Structure */
        .work-item {
            border-bottom: 1px dotted #ccc;
            padding-bottom: 1.25em;
            margin-bottom: 1.25em;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .work-content {
            flex: 1;
        }

        .work-header {
            font-size: 19px;
            line-height: 1.3;
        }

        .work-title {
            font-weight: 700;
        }

        .work-meta {
            color: #555555;
        }

        /* Short summary */
        .work-summary {
            display: block;
            color: #555555;
            font-style: italic;
            font-size: 15px;
            margin-top: 2px;
            white-space: pre-line;
        }

        /* Clickable Tags List */
        .entry-tags {
            margin: 0.5em 0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 14px;
        }
        .entry-tag-link {
            background: #f4f4f4;
            border: 1px solid #ddd;
            border-radius: 3px;
            color: #555555;
            cursor: pointer;
            padding: 1px 6px;
            text-decoration: none;
            display: inline-block;
        }
        .entry-tag-link:hover {
            background: #e8e8e8;
            color: #000000;
            border-color: #999999;
        }

        /* Compact Thumbnail Image */
        .work-thumb-wrapper {
            flex-shrink: 0;
        }
        .work-thumb {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border: 1px solid #eee;
            border-radius: 2px;
            display: block;
        }

        /* Expandable Dropdown */
        details {
            margin-top: 0.5em;
            font-size: 16px;
        }
        summary {
            cursor: pointer;
            color: #000000;
            font-size: 16px;
            user-select: none;
        }
        
        .dropdown-content {
            padding: 0.8em 0 0 0;
            white-space: pre-line;
        }
        .dropdown-content p {
            margin: 0.25em 0;
        }

        .work-full-img {
            max-width: 100%;
            max-height: 280px;
            display: block;
            margin: 10px 0;
        }

        @media (max-width: 500px) {
            .work-item {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 10px;
            }
            .work-thumb {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <main>
        <header>
            <p><a href="index.html">← go back to the beginning</a></p>
        </header>

        <!-- Controls / Search Bar -->
        <div class="controls">
            <div class="filter-group">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="search for a title, category, year..." 
                    oninput="applyFilters()"
                >
            </div>
            <div class="filter-group" id="category-pills">
                <span>Browse:</span>
                <button class="tag-btn active" onclick="filterCategory('all')">[all]</button>
                <button class="tag-btn" onclick="filterCategory('composition')">[composition]</button>
                <button class="tag-btn" onclick="filterCategory('performance')">[performance]</button>
                <button class="tag-btn" onclick="filterCategory('music release')">[releases]</button>
                <button class="tag-btn" onclick="filterCategory('theatre')">[theatre]</button>
            </div>
        </div>

        <!-- Work Entries Stream -->
        <div id="works-container">
            <p style="color: #666; font-style: italic;">loading...</p>
        </div>
    </main>

    <script>
        let allGigs = [];
        let selectedCategory = 'ALL';

        async function fetchGigs() {
            const repoUrl = "https://api.github.com/repos/lolcopter3000/thkerr/contents/content/gigs";
            const container = document.getElementById('works-container');

            try {
                const response = await fetch(repoUrl);
                if (!response.ok) throw new Error("couldn't.");
                
                const files = await response.json();
                const gigPromises = files.map(file => fetch(file.download_url).then(res => res.json()));
                allGigs = await Promise.all(gigPromises);

                // Sort newest start date first
                allGigs.sort((a, b) => new Date(b.date) - new Date(a.date));

                applyFilters();
            } catch (err) {
                container.innerHTML = `<p style="color: #888;">nothing.</p>`;
            }
        }

        function getItemCategories(gig) {
            let cats = [];
            if (Array.isArray(gig.categories)) cats = gig.categories;
            else if (Array.isArray(gig.category)) cats = gig.category;
            else if (typeof gig.category === 'string') cats = [gig.category];
            else cats = ['performance'];

            return cats;
        }

        function formatEntryDate(gig) {
            if (!gig.date) return '';
            const startYear = new Date(gig.date).getFullYear();
            
            if (gig.end_date) {
                const endYear = new Date(gig.end_date).getFullYear();
                return startYear === endYear ? `${startYear}` : `${startYear}–${endYear}`;
            }
            
            return `${startYear}`;
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            
            document.querySelectorAll('#category-pills .tag-btn').forEach(btn => {
                const text = btn.innerText.toLowerCase();
                const isMatch = (cat.toLowerCase() === 'all' && text.includes('all')) || text.includes(`[${cat.toLowerCase()}]`) || text.includes(cat.toLowerCase());
                btn.classList.toggle('active', isMatch);
            });

            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = allGigs.filter(gig => {
                const categories = getItemCategories(gig);
                
                // Category match (case-insensitive check for ALL)
                const categoryMatch = (selectedCategory.toUpperCase() === 'ALL') || 
                    categories.some(c => c.toLowerCase() === selectedCategory.toLowerCase());

                if (!categoryMatch) return false;

                // If search input is empty, return category match
                if (!searchVal) return true;

                // Extract dates/years for year matching
                const startYear = gig.date ? new Date(gig.date).getFullYear().toString() : '';
                const endYear = gig.end_date ? new Date(gig.end_date).getFullYear().toString() : '';
                const formattedDateStr = formatEntryDate(gig);

                // Search fields matching
                const titleMatch = (gig.title || '').toLowerCase().includes(searchVal);
                const summaryMatch = (gig.summary || '').toLowerCase().includes(searchVal);
                const notesMatch = (gig.notes || '').toLowerCase().includes(searchVal);
                const categorySearchMatch = categories.some(c => c.toLowerCase().includes(searchVal));
                
                // Year match (matches start year, end year, or formatted range)
                const yearMatch = startYear.includes(searchVal) || endYear.includes(searchVal) || formattedDateStr.includes(searchVal);

                return titleMatch || summaryMatch || notesMatch || categorySearchMatch || yearMatch;
            });

            renderGigs(filtered);
        }

        function renderGigs(gigs) {
            const container = document.getElementById('works-container');
            
            if (gigs.length === 0) {
                container.innerHTML = `<p style="color: #666; font-style: italic;">nothing.</p>`;
                return;
            }

            container.innerHTML = gigs.map(gig => {
                const title = gig.title || "Untitled";
                const dateDisplay = formatEntryDate(gig);
                const categories = getItemCategories(gig);

                // Filter out "All" so it's hidden from the entry's rendered tags
                const visibleCategories = categories.filter(c => c.toLowerCase() !== 'all');

                return `
                    <div class="work-item">
                        <div class="work-content">
                            <div class="work-header">
                                <span class="work-title">${title}</span>
                                ${dateDisplay ? `<span class="work-meta">(${dateDisplay})</span>` : ''}
                            </div>
                            
                            ${gig.summary ? `<span class="work-summary">${gig.summary}</span>` : ''}

                            ${visibleCategories.length > 0 ? `
                                <div class="entry-tags">
                                    ${visibleCategories.map(cat => `
                                        <span class="entry-tag-link" onclick="filterCategory('${cat}')">[${cat.toLowerCase()}]</span>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <details>
                                <summary>notes / details</summary>
                                <div class="dropdown-content">
                                    ${gig.image ? `<img src="${gig.image}" alt="${title}" class="work-full-img">` : ''}
                                    ${gig.location ? `<p><strong>Location:</strong> ${gig.location}</p>` : ''}
                                    ${gig.notes ? `<p>${gig.notes}</p>` : ''}
                                    ${gig.ticket_link ? `<p><a href="${gig.ticket_link}" target="_blank">link→</a></p>` : ''}
                                </div>
                            </details>
                        </div>

                        ${gig.image ? `
                            <div class="work-thumb-wrapper">
                                <img src="${gig.image}" alt="${title}" class="work-thumb">
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        fetchGigs();
    </script>
</body>
</html>
