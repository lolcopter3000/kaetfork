<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>thomas kerr html website - music</title>
        
        <style>
            * {
                box-sizing: border-box;
                font-size: medium;
                text-align: left;
            }
            h1, h2, h3 {
                margin-bottom: 0;
                padding-bottom: 0;
            }
            p {
                margin-top: 0;
                padding-top: 0;
            }
            img {
                height: 150px;
            }
            header div {
                display: inline-block;
                vertical-align: bottom;
            }
            body {
                font-family: 'Calibri', sans-serif;
                background-color: #2199d9; 
                margin: 0;
                padding: 0;
                background-size: 100% 600px;
                word-wrap: break-word;
                overflow-wrap: break-word;
                font-size: 20px;
                line-height: 1.7;
            }
            main {
                width: 720px;
                max-width: calc(100% - 2em);
                margin: auto;
                padding: 3em 1em;
            }
            header {
                margin: 0;
                text-align: center;
                padding: 0em 0em;
            }
            nav a {
                padding: 0.0em 0.0em;
            }
            footer {
                padding: 1em 1em;
            }
            .face-name img {
                display: inline-block;
                width: auto;
                height: 100px;
            }
            .face-name pre {
                width: 80%;
                display: inline-block;
                height: 100px;
                line-height: 1.2;
            }
            a:link {
                color: black;
                background-color: transparent;
                text-decoration: underline;
            }
            a:visited {
                color: #0A0436;
                background-color: transparent;
                text-decoration: underline;
            }
            a:hover {
                color: black;
                background-color: transparent;
                text-decoration: underline;
            }
            a:active {
                color: white;
                background-color: transparent;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>

        <footer>
            <p id="time"></p> 
        </footer>

        <script type="text/javascript" charset="utf-8">
            const myInterval = setInterval(myTimer, 1000);

            function myTimer() {
                const date = new Date();
                const timeElement = document.getElementById("time");
                if (timeElement) {
                    timeElement.innerHTML = date.toLocaleTimeString();
                }
            }

            function myStopFunction() {
                clearInterval(myInterval);
            }
