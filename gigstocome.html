<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thomas Kerr - Works & Performances</title>
        
        <style>
            * {
                box-sizing: border-box;
                font-family: 'Calibri', monospace, sans-serif;
            }
            body {
                background-color: #ffffff;
                color: #000000;
                margin: 0;
                padding: 0;
                font-size: 15px;
                line-height: 1.5;
            }

            /* Container width */
            main {
                width: 100%;
                max-width: 650px;
                margin: 0 auto;
                padding: 2.5em 1.25em;
            }

            header {
                text-align: center;
                margin-bottom: 2em;
                font-size: 14px;
            }

            a {
                color: #000000;
                text-decoration: underline;
            }
            a:visited { color: #0A0436; }
            a:hover { color: #555555; }

            /* Filter & Control Bar */
            .controls {
                background: #f4f4f4;
                padding: 12px 14px;
                border: 1px solid #ddd;
                margin-bottom: 2em;
                font-size: 13px;
            }
            .filter-group {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 8px;
            }
            .filter-group:last-child {
                margin-bottom: 0;
            }
            input[type="text"] {
                padding: 5px 8px;
                font-size: 13px;
                border: 1px solid #ccc;
                flex-grow: 1;
                width: 100%;
            }
            
            /* Tag Buttons */
            .tag-btn {
                background: transparent;
                border: none;
                color: #555555;
                cursor: pointer;
                padding: 0;
                font-size: 13px;
                text-decoration: none;
            }
            .tag-btn:hover {
                text-decoration: underline;
                color: #000000;
            }
            .tag-btn.active {
                font-weight: bold;
                color: #000000;
                text-decoration: underline;
            }

            /* Work Entry Item Structure */
            .work-item {
                border-bottom: 1px dotted #ccc;
                padding-bottom: 1.25em;
                margin-bottom: 1.25em;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 15px;
            }

            .work-content {
                flex: 1;
            }

            .work-header {
                font-size: 16px;
            }

            .work-title {
                font-weight: bold;
            }

            .work-meta {
                color: #555555;
            }

            /* Short summary: on new line, 12px, italicised gray matching tags */
            .work-summary {
                display: block;
                color: #555555;
                font-style: italic;
                font-size: 12px;
                margin-top: 2px;
            }

            /* Clickable Tags List */
            .entry-tags {
                margin: 0.4em 0;
                font-size: 12px;
            }
            .entry-tag-link {
                color: #666666;
                cursor: pointer;
                text-decoration: none;
                margin-right: 6px;
            }
            .entry-tag-link:hover {
                color: #000000;
                text-decoration: underline;
            }

            /* Compact Right-Side Thumbnail Image */
            .work-thumb-wrapper {
                flex-shrink: 0;
            }
            .work-thumb {
                width: 55px;
                height: 55px;
                object-fit: cover;
                border: 1px solid #eee;
                border-radius: 2px;
                display: block;
            }

            /* Expandable Dropdown */
            details {
                margin-top: 0.5em;
                font-size: 14px;
            }
            summary {
                cursor: pointer;
                color: #000000;
                font-size: 13px;
                user-select: none;
            }
            summary:hover {
                text-decoration: underline;
            }
            .dropdown-content {
                padding: 0.8em 0 0 0;
            }
            .work-full-img {
                max-width: 100%;
                max-height: 280px;
                display: block;
                margin: 10px 0;
            }

            /* Mobile Responsiveness */
            @media (max-width: 500px) {
                .work-item {
                    flex-direction: column-reverse;
                    align-items: flex-start;
                    gap: 10px;
                }
                .work-thumb {
                    width: 45px;
                    height: 45px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <a href="index.html" style="color:#b5723f">← go back to the beginning</a> 
            </header>

            <!-- Control / Search & Tag Filter Bar -->
            <div class="controls">
                <div class="filter-group">
                    <strong>SEARCH:</strong>
                    <input type="text" id="search-input" placeholder="Type to filter works...">
                </div>
                <div class="filter-group" id="category-buttons">
                    <strong>BROWSE:</strong>
                    <button class="tag-btn active" onclick="filterCategory('ALL')">[all]</button>
                    <button class="tag-btn" onclick="filterCategory('Composition')">[composition]</button>
                    <button class="tag-btn" onclick="filterCategory('Performance')">[performances]</button>
                    <button class="tag-btn" onclick="filterCategory('Music Release')">[releases]</button>
                    <button class="tag-btn" onclick="filterCategory('Theatre')">[theatre]</button>
                    <button class="tag-btn" onclick="filterCategory('Installation')">[installation]</button>
                </div>
            </div>

            <!-- Content Area -->
            <div id="gigs-container">Loading archive...</div>
        </main>

        <script>
            let allGigs = [];
            let activeCategory = 'ALL';

            async function loadGigs() {
                const container = document.getElementById('gigs-container');
                const repoUrl = "https://api.github.com/repos/lolcopter3000/thkerr/contents/content/gigs";

                try {
                    const response = await fetch(repoUrl);
                    if (!response.ok) throw new Error("No works found");
                    
                    const files = await response.json();
                    const gigPromises = files.map(file => fetch(file.download_url).then(res => res.json()));
                    allGigs = await Promise.all(gigPromises);

                    // Sort newest first
                    allGigs.sort((a, b) => new Date(b.date) - new Date(a.date));

                    renderGigs(allGigs);
                } catch (err) {
                    container.innerHTML = "No archive items found.";
                }
            }

            function getItemTags(gig) {
                if (Array.isArray(gig.categories)) return gig.categories;
                if (Array.isArray(gig.category)) return gig.category;
                if (typeof gig.category === 'string') return [gig.category];
                return ['Performance'];
            }

            function renderGigs(items) {
                const container = document.getElementById('gigs-container');
                if (items.length === 0) {
                    container.innerHTML = "<em>No matching entries found.</em>";
                    return;
                }

                container.innerHTML = items.map(gig => {
                    const year = new Date(gig.date).getFullYear();
                    const tags = getItemTags(gig);

                    const tagsHtml = `
                        <span class="entry-tag-link" onclick="filterCategory('ALL')">[all]</span>
                        ${tags.map(t => `<span class="entry-tag-link" onclick="filterCategory('${t}')">[${t.toLowerCase()}]</span>`).join('')}
                    `;

                    return `
                        <div class="work-item">
                            <div class="work-content">
                                <!-- Title and Year -->
                                <div class="work-header">
                                    <span class="work-title">${gig.title}</span> 
                                    <span class="work-meta">(${year})</span>
                                </div>

                                <!-- Summary on separate line in 12px italics -->
                                ${gig.summary ? `<span class="work-summary">${gig.summary}</span>` : ''}

                                <!-- Clickable Tags -->
                                <div class="entry-tags">
                                    ${tagsHtml}
                                </div>

                                <!-- Expandable Dropdown -->
                                ${(gig.notes || gig.image || gig.ticket_link || gig.location) ? `
                                    <details>
                                        <summary>[more info / details]</summary>
                                        <div class="dropdown-content">
                                            ${gig.location ? `<p style="margin: 0 0 0.5em 0;"><strong>Venue / Location:</strong> ${gig.location}</p>` : ''}
                                            ${gig.image ? `<img src="${gig.image}" alt="${gig.title}" class="work-full-img">` : ''}
                                            ${gig.notes ? `<p style="margin: 0.5em 0;">${gig.notes}</p>` : ''}
                                            ${gig.ticket_link ? `<a href="${gig.ticket_link}" target="_blank" style="font-size: 13px;">[link / documentation]</a>` : ''}
                                        </div>
                                    </details>
                                ` : ''}
                            </div>

                            <!-- Small Right-Aligned Thumbnail -->
                            ${gig.image ? `
                                <div class="work-thumb-wrapper">
                                    <img src="${gig.image}" alt="${gig.title}" class="work-thumb">
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }

            function filterCategory(cat) {
                activeCategory = cat;
                
                document.querySelectorAll('#category-buttons button').forEach(btn => {
                    const btnText = btn.innerText.replace('[', '').replace(']', '').toLowerCase();
                    const targetText = cat.toLowerCase();
                    btn.classList.toggle('active', btnText === targetText || (cat === 'ALL' && btnText === 'all'));
                });

                applyFilters();
            }

            function applyFilters() {
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                
                const filtered = allGigs.filter(gig => {
                    const itemTags = getItemTags(gig);
                    const matchesCategory = (
                        activeCategory === 'ALL' || 
                        itemTags.some(t => t.toLowerCase() === activeCategory.toLowerCase())
                    );
                    
                    const matchesSearch = (
                        gig.title?.toLowerCase().includes(searchTerm) || 
                        gig.summary?.toLowerCase().includes(searchTerm) ||
                        gig.location?.toLowerCase().includes(searchTerm) ||
                        gig.notes?.toLowerCase().includes(searchTerm)
                    );

                    return matchesCategory && matchesSearch;
                });

                renderGigs(filtered);
            }

            document.getElementById('search-input').addEventListener('input', applyFilters);

            loadGigs();
        </script>
    </body>
</html>
