<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thomas Kerr - Works & Performances</title>
        
        <style>
            * {
                box-sizing: border-box;
                font-family: 'Calibri', monospace, sans-serif;
            }
            body {
                background-color: #ffffff;
                color: #000000;
                margin: 0;
                padding: 0;
                font-size: 15px;
                line-height: 1.5;
            }

            /* Container styled to Kate Wagner's narrow width */
            main {
                width: 100%;
                max-width: 650px;
                margin: 0 auto;
                padding: 2.5em 1.25em;
            }

            header {
                text-align: center;
                margin-bottom: 2em;
                font-size: 14px;
            }

            a {
                color: #000000;
                text-decoration: underline;
            }
            a:visited { color: #0A0436; }
            a:hover { color: #555555; }

            /* Sebastian Adams Filter & Control Bar */
            .controls {
                background: #f4f4f4;
                padding: 12px 14px;
                border: 1px solid #ddd;
                margin-bottom: 2em;
                font-size: 13px;
            }
            .filter-group {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 8px;
            }
            .filter-group:last-child {
                margin-bottom: 0;
            }
            input[type="text"] {
                padding: 5px 8px;
                font-size: 13px;
                border: 1px solid #ccc;
                flex-grow: 1;
                width: 100%;
            }
            
            /* Tag Buttons */
            .tag-btn {
                background: transparent;
                border: none;
                color: #555555;
                cursor: pointer;
                padding: 0;
                font-size: 13px;
                text-decoration: none;
            }
            .tag-btn:hover {
                text-decoration: underline;
                color: #000000;
            }
            .tag-btn.active {
                font-weight: bold;
                color: #000000;
                text-decoration: underline;
            }

            /* Work Entry Item */
            .work-item {
                border-bottom: 1px dotted #ccc;
                padding-bottom: 1.25em;
                margin-bottom: 1.25em;
            }

            .work-header {
                font-size: 16px;
            }

            .work-title {
                font-weight: bold;
            }

            .work-date {
                color: #555555;
            }

            .work-tagline {
                font-style: italic;
                color: #333333;
                margin: 0.25em 0;
                font-size: 14px;
            }

            /* Clickable tags rendered next to each entry */
            .entry-tags {
                margin: 0.4em 0;
                font-size: 12px;
            }
            .entry-tag-link {
                color: #666666;
                cursor: pointer;
                text-decoration: none;
                margin-right: 4px;
            }
            .entry-tag-link:hover {
                color: #000000;
                text-decoration: underline;
            }

            /* Native Expandable Dropdown (<details> / <summary>) */
            details {
                margin-top: 0.5em;
                font-size: 14px;
            }
            summary {
                cursor: pointer;
                color: #000000;
                font-size: 13px;
                user-select: none;
            }
            summary:hover {
                text-decoration: underline;
            }
            .dropdown-content {
                padding: 0.8em 0 0 0;
            }
            .work-img {
                max-width: 100%;
                max-height: 250px;
                display: block;
                margin: 10px 0;
            }

            /* Responsive Adjustments for Mobile */
            @media (max-width: 600px) {
                body { font-size: 14px; }
                main { padding: 1.25em 1em; }
                .controls { padding: 10px; }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <a href="index.html" style="color:#b5723f">← go back to the beginning</a> 
            </header>

            <!-- Control / Search & Tag Filter Bar -->
            <div class="controls">
                <div class="filter-group">
                    <strong>SEARCH:</strong>
                    <input type="text" id="search-input" placeholder="Type to filter works...">
                </div>
                <div class="filter-group" id="category-buttons">
                    <strong>BROWSE:</strong>
                    <button class="tag-btn active" onclick="filterCategory('ALL')">[all]</button>
                    <button class="tag-btn" onclick="filterCategory('Performance')">[performances]</button>
                    <button class="tag-btn" onclick="filterCategory('Music Release')">[releases]</button>
                    <button class="tag-btn" onclick="filterCategory('Theatre')">[theatre]</button>
                </div>
            </div>

            <!-- Content Area -->
            <div id="gigs-container">Loading archive...</div>
        </main>

        <script>
            let allGigs = [];
            let activeCategory = 'ALL';

            async function loadGigs() {
                const container = document.getElementById('gigs-container');
                const repoUrl = "https://api.github.com/repos/lolcopter3000/thkerr/contents/content/gigs";

                try {
                    const response = await fetch(repoUrl);
                    if (!response.ok) throw new Error("No works found");
                    
                    const files = await response.json();
                    const gigPromises = files.map(file => fetch(file.download_url).then(res => res.json()));
                    allGigs = await Promise.all(gigPromises);

                    // Sort newest first
                    allGigs.sort((a, b) => new Date(b.date) - new Date(a.date));

                    renderGigs(allGigs);
                } catch (err) {
                    container.innerHTML = "No archive items found.";
                }
            }

            function renderGigs(items) {
                const container = document.getElementById('gigs-container');
                if (items.length === 0) {
                    container.innerHTML = "<em>No matching entries found.</em>";
                    return;
                }

                container.innerHTML = items.map(gig => {
                    const year = new Date(gig.date).getFullYear();
                    const catTag = gig.category || 'Performance';

                    return `
                        <div class="work-item">
                            <!-- Title & Year -->
                            <div class="work-header">
                                <span class="work-title">${gig.title}</span> 
                                <span class="work-date">(${year})</span>
                            </div>

                            <!-- Brief Italicised Description / Location -->
                            <div class="work-tagline">
                                ${gig.location ? `${gig.location}` : 'Works / Archive entry'}
                            </div>

                            <!-- Square Bracket Tags -->
                            <div class="entry-tags">
                                <span class="entry-tag-link" onclick="filterCategory('ALL')">[all]</span>
                                <span class="entry-tag-link" onclick="filterCategory('${catTag}')">[${catTag.toLowerCase()}]</span>
                            </div>

                            <!-- Expandable Dropdown with Detailed Info -->
                            ${(gig.notes || gig.image || gig.ticket_link) ? `
                                <details>
                                    <summary>[more info / details]</summary>
                                    <div class="dropdown-content">
                                        ${gig.image ? `<img src="${gig.image}" alt="${gig.title}" class="work-img">` : ''}
                                        ${gig.notes ? `<p style="margin: 0.5em 0;">${gig.notes}</p>` : ''}
                                        ${gig.ticket_link ? `<a href="${gig.ticket_link}" target="_blank" style="font-size: 13px;">[link / documentation]</a>` : ''}
                                    </div>
                                </details>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            }

            function filterCategory(cat) {
                activeCategory = cat;
                
                // Highlight active category in filter bar
                document.querySelectorAll('#category-buttons button').forEach(btn => {
                    const btnText = btn.innerText.replace('[', '').replace(']', '').toLowerCase();
                    const targetText = cat.toLowerCase();
                    btn.classList.toggle('active', btnText === targetText || (cat === 'ALL' && btnText === 'all'));
                });

                applyFilters();
            }

            function applyFilters() {
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                
                const filtered = allGigs.filter(gig => {
                    const matchesCategory = (activeCategory === 'ALL' || (gig.category && gig.category.toLowerCase() === activeCategory.toLowerCase()));
                    const matchesSearch = (gig.title?.toLowerCase().includes(searchTerm) || 
                                           gig.location?.toLowerCase().includes(searchTerm) ||
                                           gig.notes?.toLowerCase().includes(searchTerm));
                    return matchesCategory && matchesSearch;
                });

                renderGigs(filtered);
            }

            document.getElementById('search-input').addEventListener('input', applyFilters);

            loadGigs();
        </script>
    </body>
</html>
