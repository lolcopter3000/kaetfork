<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>thomas kerr html website - music</title>
        
        <style>
            * {
                box-sizing: border-box;
                font-size: medium;
                text-align: left;
            }
            h1, h2, h3 {
                margin-bottom: 0;
                padding-bottom: 0;
            }
            p {
                margin-top: 0;
                padding-top: 0;
            }
            img {
                height: 150px;
            }
            header div {
                display: inline-block;
                vertical-align: bottom;
            }
            body {
                font-family: 'Calibri', sans-serif;
                background-color: #2199d9; 
                margin: 0;
                padding: 0;
                background-size: 100% 600px;
                word-wrap: break-word;
                overflow-wrap: break-word;
                font-size: 20px;
                line-height: 1.7;
            }
            main {
                width: 720px;
                max-width: calc(100% - 2em);
                margin: auto;
                padding: 3em 1em;
            }
            header {
                margin: 0;
                text-align: center;
                padding: 0em 0em;
            }
            nav a {
                padding: 0.0em 0.0em;
            }
            footer {
                padding: 1em 1em;
            }
            .face-name img {
                display: inline-block;
                width: auto;
                height: 100px;
            }
            .face-name pre {
                width: 80%;
                display: inline-block;
                height: 100px;
                line-height: 1.2;
            }
            a:link {
                color: black;
                background-color: transparent;
                text-decoration: underline;
            }
            a:visited {
                color: #0A0436;
                background-color: transparent;
                text-decoration: underline;
            }
            a:hover {
                color: black;
                background-color: transparent;
                text-decoration: underline;
            }
            a:active {
                color: white;
                background-color: transparent;
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <br><br><br><br>

        <header>
            <a href="index.html" style="color:#b5723f">go back to the beginning</a> 
        </header>

  <main>
    <div id="gigs-container">Loading performances...</div>

    <script type="module">
        import { run } from './play.core/src/run.js'
        import * as program from './name.js'
        run(program, { element : document.querySelector('pre') }).then(function(e){
            console.log(e)
        }).catch(function(e) {
            console.warn(e.message)
            console.log(e.error)
        })
    </script>

    <script>
        async function loadGigs() {
            const container = document.getElementById('gigs-container');
            
            // Update this URL with your GitHub username and repo name!
            const repoUrl = "https://api.github.com/repos/YOUR_GITHUB_USERNAME/YOUR_REPOSITORY_NAME/contents/content/gigs";

            try {
                const response = await fetch(repoUrl);
                if (!response.ok) throw new Error("No gigs found yet");
                
                const files = await response.json();
                
                // Fetch each JSON file contents
                const gigPromises = files.map(file => fetch(file.download_url).then(res => res.json()));
                const gigs = await Promise.all(gigPromises);

                // Sort gigs by date (newest first)
                gigs.sort((a, b) => new Date(b.date) - new Date(a.date));

                if (gigs.length === 0) {
                    container.innerHTML = "No upcoming performances listed.";
                    return;
                }

                // Render HTML
                container.innerHTML = gigs.map(gig => `
                    <div style="margin-bottom: 2em;">
                        ${gig.image ? `<img src="${gig.image}" alt="${gig.title}" style="display:block; margin-bottom: 0.5em; max-height: 200px;"><br>` : ''}
                        <strong>${new Date(gig.date).toLocaleDateString('en-GB')}</strong>, 
                        <i>${gig.title}</i>, ${gig.location}.
                        ${gig.ticket_link ? `<a href="${gig.ticket_link}" target="_blank">[tickets]</a>` : ''}
                        ${gig.notes ? `<p style="margin-top: 0.5em;">${gig.notes}</p>` : ''}
                    </div>
                `).join('');

            } catch (err) {
                container.innerHTML = "No upcoming performances found.";
            }
        }

        loadGigs();
    </script>
</main>
        <footer>
            <p id="time"></p> 
        </footer>

        <script type="text/javascript" charset="utf-8">
            const myInterval = setInterval(myTimer, 1000);

            function myTimer() {
                const date = new Date();
                const timeElement = document.getElementById("time");
                if (timeElement) {
                    timeElement.innerHTML = date.toLocaleTimeString();
                }
            }

            function myStopFunction() {
                clearInterval(myInterval);
            }
        </script>
    </body>
</html>
