<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thomas Kerr</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, ui-monospace, monospace;
        }
        body {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            font-size: 13px;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        /* Container width & mobile padding */
        main {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
            padding: 2em 1.25em;
        }

        header {
            text-align: center;
            margin-bottom: 2em;
            font-size: 13px;
        }

        a {
            color: #000000;
            text-decoration: underline;
        }
        a:visited { color: #000000; }
        a:hover { color: #555555; }

        /* Filter & Control Bar */
        .controls {
            background: #f9f9f9;
            padding: 12px 14px;
            border: 1px solid #ccc;
            margin-bottom: 2em;
            font-size: 12px;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 10px;
        }
        .filter-group:last-child {
            margin-bottom: 0;
        }
        
        input[type="text"] {
            padding: 6px 10px;
            font-size: 12px;
            border: 1px solid #ccc;
            flex-grow: 1;
            width: 100%;
            font-family: inherit;
            border-radius: 0;
            background: #fff;
            -webkit-appearance: none;
        }
        
        /* Bracket Button Styling */
        .btn-tag {
            background: #ffffff;
            border: 1px solid #333333;
            color: #000000;
            cursor: pointer;
            padding: 2px 7px;
            font-size: 11px;
            text-decoration: none;
            font-family: inherit;
            display: inline-block;
            margin-bottom: 2px;
        }
        .btn-tag:hover {
            background: #000000;
            color: #ffffff;
        }
        .btn-tag.active {
            background: #000000;
            color: #ffffff;
            font-weight: bold;
        }

        /* Work Entry Item Structure */
        .work-item {
            border-bottom: 1px dotted #888;
            padding-bottom: 1.25em;
            margin-bottom: 1.25em;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .work-content {
            flex: 1;
            min-width: 0; /* Prevents flex overflow on mobile */
        }

        .work-header {
            font-size: 13px;
            line-height: 1.4;
        }

        .work-title {
            font-weight: bold;
        }

        .work-meta {
            color: #555555;
        }

        /* Short summary */
        .work-summary {
            display: block;
            color: #444444;
            font-size: 11px;
            margin-top: 4px;
            white-space: pre-line;
            word-wrap: break-word;
        }

        /* Inline Category Tags */
        .entry-tags {
            margin: 0.5em 0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* Compact Thumbnail Image */
        .work-thumb-wrapper {
            flex-shrink: 0;
        }
        .work-thumb {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border: 1px solid #ccc;
            display: block;
        }

        /* Expandable Dropdown */
        details {
            margin-top: 0.5em;
            font-size: 12px;
        }
        summary {
            cursor: pointer;
            color: #000000;
            font-size: 11px;
            user-select: none;
        }
        summary:hover {
            text-decoration: underline;
        }
        
        .dropdown-content {
            padding: 0.8em 0 0 0;
            white-space: pre-line;
            word-wrap: break-word;
        }
        .dropdown-content p {
            margin: 0.25em 0;
        }

        .work-full-img {
            max-width: 100%;
            max-height: 280px;
            display: block;
            margin: 10px 0;
            border: 1px solid #ccc;
        }

        /* Mobile Adjustments */
        @media (max-width: 500px) {
            main {
                padding: 1.5em 1em;
            }
            .work-item {
                flex-direction: column-reverse;
                align-items: flex-start;
                gap: 10px;
            }
            .work-thumb {
                width: 45px;
                height: 45px;
            }
        }
    </style>
</head>
<body>

    <main>
        <header>
            <p><a href="index.html">← go back to the beginning</a></p>
        </header>

        <!-- Controls / Search Bar -->
        <div class="controls">
            <div class="filter-group">
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="search for a title, category, year..." 
                    oninput="applyFilters()"
                >
            </div>
            <div class="filter-group" id="category-pills">
                <span style="font-size: 11px; margin-right: 4px;">BROWSE:</span>
                <button class="btn-tag active" onclick="filterCategory('ALL')">[all]</button>
                <button class="btn-tag" onclick="filterCategory('Composition')">[composition]</button>
                <button class="btn-tag" onclick="filterCategory('Performance')">[performance]</button>
                <button class="btn-tag" onclick="filterCategory('Music Release')">[releases]</button>
                <button class="btn-tag" onclick="filterCategory('Theatre')">[theatre]</button>
                <button class="btn-tag" onclick="filterCategory('Installation')">[installation]</button>
            </div>
        </div>

        <!-- Work Entries Stream -->
        <div id="works-container">
            <p style="color: #666;">Loading archive...</p>
        </div>
    </main>

    <script>
        let allGigs = [];
        let selectedCategory = 'ALL';

        async function fetchGigs() {
            const repoUrl = "https://api.github.com/repos/lolcopter3000/thkerr/contents/content/gigs";
            const container = document.getElementById('works-container');

            try {
                const response = await fetch(repoUrl);
                if (!response.ok) throw new Error("Could not fetch entries.");
                
                const files = await response.json();
                
                // Only process .json files to avoid crash on hidden system files
                const jsonFiles = files.filter(file => file.name.endsWith('.json'));
                const gigPromises = jsonFiles.map(file => fetch(file.download_url).then(res => res.json()));
                allGigs = await Promise.all(gigPromises);

                // Safe Date Sorting (newest start date first)
                allGigs.sort((a, b) => {
                    const timeA = a.date ? new Date(a.date).getTime() : 0;
                    const timeB = b.date ? new Date(b.date).getTime() : 0;
                    return timeB - timeA;
                });

                applyFilters();
            } catch (err) {
                container.innerHTML = `<p style="color: #888;">No works currently found in the archive.</p>`;
            }
        }

        function getItemCategories(gig) {
            let cats = [];
            if (Array.isArray(gig.categories)) cats = gig.categories;
            else if (Array.isArray(gig.category)) cats = gig.category;
            else if (typeof gig.category === 'string') cats = [gig.category];
            else cats = ['Performance'];

            return cats;
        }

        function formatEntryDate(gig) {
            if (!gig || !gig.date) return '';
            const startDate = new Date(gig.date);
            if (isNaN(startDate.getTime())) return '';

            const startYear = startDate.getFullYear();
            
            if (gig.end_date) {
                const endDate = new Date(gig.end_date);
                if (!isNaN(endDate.getTime())) {
                    const endYear = endDate.getFullYear();
                    return startYear === endYear ? `${startYear}` : `${startYear}–${endYear}`;
                }
            }
            
            return `${startYear}`;
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            
            document.querySelectorAll('#category-pills .btn-tag').forEach(btn => {
                const text = btn.innerText.replace('[', '').replace(']', '').toLowerCase().trim();
                const isMatch = (cat === 'ALL' && text === 'all') || text.includes(cat.toLowerCase());
                btn.classList.toggle('active', isMatch);
            });

            applyFilters();
        }

        function applyFilters() {
            const searchVal = document.getElementById('search-input').value.toLowerCase().trim();

            const filtered = allGigs.filter(gig => {
                const categories = getItemCategories(gig);
                
                // Category match
                const categoryMatch = (selectedCategory === 'ALL') || 
                    categories.some(c => c.toLowerCase() === selectedCategory.toLowerCase());

                if (!categoryMatch) return false;

                // If search input is empty, return category match
                if (!searchVal) return true;

                // Extract dates/years for year matching safely
                const startYear = gig.date && !isNaN(new Date(gig.date).getTime()) 
                    ? new Date(gig.date).getFullYear().toString() 
                    : '';
                const endYear = gig.end_date && !isNaN(new Date(gig.end_date).getTime()) 
                    ? new Date(gig.end_date).getFullYear().toString() 
                    : '';
                const formattedDateStr = formatEntryDate(gig);

                // Search fields matching
                const titleMatch = (gig.title || '').toLowerCase().includes(searchVal);
                const summaryMatch = (gig.summary || '').toLowerCase().includes(searchVal);
                const notesMatch = (gig.notes || '').toLowerCase().includes(searchVal);
                const categorySearchMatch = categories.some(c => c.toLowerCase().includes(searchVal));
                
                // Year match (matches start year, end year, or formatted range)
                const yearMatch = startYear.includes(searchVal) || 
                                  endYear.includes(searchVal) || 
                                  formattedDateStr.includes(searchVal);

                return titleMatch || summaryMatch || notesMatch || categorySearchMatch || yearMatch;
            });

            renderGigs(filtered);
        }

        function renderGigs(gigs) {
            const container = document.getElementById('works-container');
            
            if (gigs.length === 0) {
                container.innerHTML = `<p style="color: #666;">No works matching your search criteria.</p>`;
                return;
            }

            container.innerHTML = gigs.map(gig => {
                const title = gig.title || "Untitled";
                const dateDisplay = formatEntryDate(gig);
                const categories = getItemCategories(gig);

                // Filter out "All" so it's hidden from the entry's rendered tags
                const visibleCategories = categories.filter(c => c.toLowerCase() !== 'all');

                return `
                    <div class="work-item">
                        <div class="work-content">
                            <div class="work-header">
                                <span class="work-title">${title}</span>
                                ${dateDisplay ? `<span class="work-meta">(${dateDisplay})</span>` : ''}
                            </div>
                            
                            ${gig.summary ? `<span class="work-summary">${gig.summary}</span>` : ''}

                            ${visibleCategories.length > 0 ? `
                                <div class="entry-tags">
                                    ${visibleCategories.map(cat => `
                                        <button class="btn-tag" onclick="filterCategory('${cat}')">[${cat.toLowerCase()}]</button>
                                    `).join('')}
                                </div>
                            ` : ''}

                            <details>
                                <summary>[+ details / notes]</summary>
                                <div class="dropdown-content">
                                    ${gig.image ? `<img src="${gig.image}" alt="${title}" class="work-full-img">` : ''}
                                    ${gig.location ? `<p><strong>Location:</strong> ${gig.location}</p>` : ''}
                                    ${gig.notes ? `<p>${gig.notes}</p>` : ''}
                                    ${gig.ticket_link ? `<p><a href="${gig.ticket_link}" target="_blank">Documentation / External Link →</a></p>` : ''}
                                </div>
                            </details>
                        </div>

                        ${gig.image ? `
                            <div class="work-thumb-wrapper">
                                <img src="${gig.image}" alt="${title}" class="work-thumb">
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        fetchGigs();
    </script>
</body>
</html>
