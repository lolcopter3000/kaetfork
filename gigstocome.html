<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thomas Kerr - Works & Performances</title>
        
        <style>
            * {
                box-sizing: border-box;
                font-family: 'Calibri', monospace, sans-serif;
            }
            body {
                background-color: #FFFFFF;
                color: #000000;
                margin: 0;
                padding: 0;
                font-size: 15px;
                line-height: 1.5;
            }
            /* Kate Wagner's narrow reading width settings */
            main {
                width: 100%;
                max-width: 650px;
                margin: 0 auto;
                padding: 2em 1.25em;
            }
            header {
                text-align: center;
                margin-bottom: 1.5em;
                font-size: 14px;
            }
            a {
                color: #000000;
                text-decoration: underline;
            }
            a:visited { color: #0A0436; }
            a:hover { color: #555555; }

            /* Sebastian Adams Filter Controls */
            .controls {
                background: #f4f4f4;
                padding: 12px 14px;
                border: 1px solid #ddd;
                margin-bottom: 2em;
                font-size: 13px;
            }
            .filter-group {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                align-items: center;
                margin-bottom: 10px;
            }
            .filter-group:last-child {
                margin-bottom: 0;
            }
            input[type="text"] {
                padding: 5px 8px;
                font-size: 13px;
                border: 1px solid #ccc;
                flex-grow: 1;
                width: 100%;
            }
            button.btn-filter {
                background: #e0e0e0;
                border: 1px solid #aaa;
                padding: 3px 8px;
                cursor: pointer;
                font-size: 12px;
            }
            button.btn-filter.active {
                background: #000000;
                color: #ffffff;
            }

            /* Entry Items */
            .work-item {
                border-bottom: 1px dotted #ccc;
                padding-bottom: 1.25em;
                margin-bottom: 1.25em;
            }
            .work-meta {
                font-size: 12px;
                color: #666666;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }
            .work-title {
                font-size: 17px;
                font-weight: bold;
                margin: 0.2em 0;
            }
            .work-img {
                max-width: 100%;
                max-height: 250px;
                display: block;
                margin: 10px 0;
            }

            /* Responsive Adjustments for Mobile */
            @media (max-width: 600px) {
                body {
                    font-size: 14px;
                }
                main {
                    padding: 1.25em 1em;
                }
                .controls {
                    padding: 10px;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <header>
                <a href="index.html" style="color:#b5723f">← go back to the beginning</a> 
            </header>

            <!-- Control / Archive Filter Bar -->
            <div class="controls">
                <div class="filter-group">
                    <strong>SEARCH:</strong>
                    <input type="text" id="search-input" placeholder="Type to filter works...">
                </div>
                <div class="filter-group" id="category-buttons">
                    <strong>BROWSE:</strong>
                    <button class="btn-filter active" onclick="filterCategory('ALL')">ALL</button>
                    <button class="btn-filter" onclick="filterCategory('Performance')">PERFORMANCES</button>
                    <button class="btn-filter" onclick="filterCategory('Music Release')">RELEASES</button>
                    <button class="btn-filter" onclick="filterCategory('Theatre')">THEATRE</button>
                </div>
            </div>

            <!-- Content Area -->
            <div id="gigs-container">Loading archive...</div>
        </main>

        <script>
            let allGigs = [];
            let activeCategory = 'ALL';

            async function loadGigs() {
                const container = document.getElementById('gigs-container');
                const repoUrl = "https://api.github.com/repos/lolcopter3000/thkerr/contents/content/gigs";

                try {
                    const response = await fetch(repoUrl);
                    if (!response.ok) throw new Error("No works found");
                    
                    const files = await response.json();
                    const gigPromises = files.map(file => fetch(file.download_url).then(res => res.json()));
                    allGigs = await Promise.all(gigPromises);

                    // Sort newest first
                    allGigs.sort((a, b) => new Date(b.date) - new Date(a.date));

                    renderGigs(allGigs);
                } catch (err) {
                    container.innerHTML = "No archive items found.";
                }
            }

            function renderGigs(items) {
                const container = document.getElementById('gigs-container');
                if (items.length === 0) {
                    container.innerHTML = "<em>No matching entries found.</em>";
                    return;
                }

                container.innerHTML = items.map(gig => `
                    <div class="work-item">
                        <div class="work-meta">
                            [${gig.category || 'WORK'}] — ${new Date(gig.date).toLocaleDateString('en-GB')}
                        </div>
                        <div class="work-title">
                            <i>${gig.title}</i> ${gig.location ? `— ${gig.location}` : ''}
                        </div>
                        ${gig.image ? `<img src="${gig.image}" alt="${gig.title}" class="work-img">` : ''}
                        ${gig.notes ? `<p style="margin:0.5em 0;">${gig.notes}</p>` : ''}
                        ${gig.ticket_link ? `<a href="${gig.ticket_link}" target="_blank" style="font-size:13px;">[link / details]</a>` : ''}
                    </div>
                `).join('');
            }

            function filterCategory(cat) {
                activeCategory = cat;
                
                document.querySelectorAll('#category-buttons button').forEach(btn => {
                    btn.classList.toggle('active', btn.innerText.includes(cat.toUpperCase()));
                });

                applyFilters();
            }

            function applyFilters() {
                const searchTerm = document.getElementById('search-input').value.toLowerCase();
                
                const filtered = allGigs.filter(gig => {
                    const matchesCategory = (activeCategory === 'ALL' || gig.category === activeCategory);
                    const matchesSearch = (gig.title?.toLowerCase().includes(searchTerm) || 
                                           gig.location?.toLowerCase().includes(searchTerm) ||
                                           gig.notes?.toLowerCase().includes(searchTerm));
                    return matchesCategory && matchesSearch;
                });

                renderGigs(filtered);
            }

            document.getElementById('search-input').addEventListener('input', applyFilters);

            loadGigs();
        </script>
    </body>
</html>
